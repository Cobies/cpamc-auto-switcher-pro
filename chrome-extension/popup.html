<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPAMC Session Syncer</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(20, 31, 55, 0.85);
      --border: rgba(56, 189, 248, 0.35);
      --accent: #0ea5e9;
      --accent-glow: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #34d399;
      --error: #f87171;
    }

    body {
      margin: 0;
      padding: 16px;
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: radial-gradient(circle at 80% 10%, rgba(56, 189, 248, 0.15) 0%, transparent 60%), var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(14, 165, 233, 0.1));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    .title-box h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #bae6fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-box p {
      margin: 2px 0 0;
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    .field {
      margin-bottom: 10px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 6px;
      padding: 7px 9px;
      color: var(--text);
      font-size: 11px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent-glow);
    }

    .detected-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      width: 100%;
      box-sizing: border-box;
    }

    .btn-sync {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(56, 189, 248, 0.6);
      border-radius: 8px;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-sync:hover {
      background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
    }

    .btn-sync:active {
      transform: translateY(1px);
    }

    .btn-sync:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      display: none;
      line-height: 1.4;
      word-break: break-word;
    }

    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--success);
    }

    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: var(--error);
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 9.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-box">⚡</div>
    <div class="title-box">
      <h1>CPAMC Session Syncer</h1>
      <p>Gemini Argon · Multi-Profile & Pools</p>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>Servidor CPAMC Gateway</label>
      <input type="text" id="serverUrl" value="http://192.168.10.150:8317">
    </div>

    <div class="field">
      <label>Management Key (Token de Acceso)</label>
      <input type="password" id="managementKey" placeholder="Pega tu token de gestión si se requiere">
    </div>

    <!-- Identidad de Cuenta & Multi-Perfil -->
    <div class="field grid-2">
      <div>
        <label title="Índice numérico de cuenta para pools (0, 1, 2...)">AuthUser</label>
        <input type="text" id="authUser" value="0" placeholder="0">
      </div>
      <div>
        <label>Correo Google (Cuenta Real)</label>
        <input type="text" id="accountEmail" placeholder="ej. usuario@gmail.com">
      </div>
    </div>

    <div class="field">
      <label>Pestaña Activa</label>
      <div class="detected-badge" id="detectedAccount">
        <span>🌐</span>
        <span id="detectedAccountText">Comprobando pestaña actual...</span>
      </div>
    </div>
  </div>

  <button type="button" class="btn-sync" id="btnSync">
    <span>⚡</span>
    <span id="btnSyncText">Sincronizar Sesión en 1-Click</span>
  </button>

  <div class="status-msg" id="statusMsg"></div>

  <div class="footer">
    Auto Switcher Pro · Pure Virtual Session Bridge
  </div>

  <script src="popup.js"></script>
</body>
</html>

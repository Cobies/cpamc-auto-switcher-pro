name: Release Linux Auto-Switcher-Pro Plugin

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Explicit release version tag (e.g. v0.1.2 or v0.2.0, must strictly match vX.Y.Z)'
        required: false
        type: string

concurrency:
  group: auto-switcher-pro-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and Validate Linux Plugin
    runs-on: ubuntu-latest
    if: (github.repository == 'WiloxDev/cpamc-auto-switcher-pro' || github.repository == 'gonzalez962/cpamc-auto-switcher') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      version: ${{ steps.resolve_tag.outputs.version }}
      commit_sha: ${{ steps.resolve_tag.outputs.commit_sha }}
      should_release: ${{ steps.resolve_tag.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository, branch, and resolve tag via semantic commits
        id: resolve_tag
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${REPO}" != "WiloxDev/cpamc-auto-switcher-pro" ] && [ "${REPO}" != "gonzalez962/cpamc-auto-switcher" ]; then
            echo "::error::Unauthorized repository: ${REPO}. Workflow only allowed on authorized repositories."
            exit 1
          fi
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::Invalid branch: ${REF}. Release workflow must run on refs/heads/main."
            exit 1
          fi

          if [ -n "${INPUT_TAG}" ]; then
            RESOLVED_TAG="${INPUT_TAG}"
            echo "Using manual input tag: ${RESOLVED_TAG}"
          else
            # Fetch all tags from origin
            git fetch --tags --force origin 2>/dev/null || true
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            echo "Latest existing git tag: ${LATEST_TAG}"

            BASE_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VER}"

            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s")
            if [ -z "${COMMITS}" ]; then
              echo "No new commits since ${LATEST_TAG}. Skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            BUMP="patch"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ BREAKING[[:space:]]CHANGE || "$line" =~ ^[a-z]+(\([^\)]+\))?!: ]]; then
                BUMP="major"
                break
              elif [[ "$line" =~ ^feat(\([^\)]+\))?: ]]; then
                if [ "$BUMP" != "major" ]; then
                  BUMP="minor"
                fi
              elif [[ "$line" =~ ^fix(\([^\)]+\))?: || "$line" =~ ^perf(\([^\)]+\))?: || "$line" =~ ^refactor(\([^\)]+\))?: ]]; then
                if [ "$BUMP" != "major" ] && [ "$BUMP" != "minor" ]; then
                  BUMP="patch"
                fi
              fi
            done <<< "${COMMITS}"

            echo "Calculated SemVer bump type: ${BUMP}"
            case "${BUMP}" in
              major)
                NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
                ;;
              patch)
                NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
            esac

            RESOLVED_TAG="v${NEW_VERSION}"
          fi

          if [[ ! "${RESOLVED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Resolved tag '${RESOLVED_TAG}' does not match expected format vX.Y.Z (e.g. v0.1.0)"
            exit 1
          fi

          VERSION="${RESOLVED_TAG#v}"
          COMMIT_SHA=$(git rev-parse HEAD)

          echo "tag=${RESOLVED_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${RESOLVED_TAG} (version: ${VERSION})"

      - name: Validate tag collision and commit ancestry
        id: validate
        if: steps.resolve_tag.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # 1. Pin checked-out commit SHA and verify alignment with workflow SHA on main
          COMMIT_SHA=$(git rev-parse HEAD)
          if [ -n "${DISPATCH_SHA}" ] && [ "${COMMIT_SHA}" != "${DISPATCH_SHA}" ]; then
            echo "::error::Checked-out SHA ${COMMIT_SHA} does not match dispatch SHA ${DISPATCH_SHA}."
            exit 1
          fi

          # Verify checked-out commit is contained in origin/main before any mutation
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          MAIN_COMMIT=$(git rev-parse --verify refs/remotes/origin/main)
          if ! git merge-base --is-ancestor "${COMMIT_SHA}" "${MAIN_COMMIT}"; then
            echo "::error::Commit ${COMMIT_SHA} is not an ancestor of origin/main (${MAIN_COMMIT})."
            exit 1
          fi

          # 2. Check for existing remote tag collision (fail-closed)
          set +e
          TAG_CHECK_OUTPUT=$(git ls-remote --exit-code origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" 2>&1)
          TAG_CHECK_EXIT=$?
          set -e

          if [ ${TAG_CHECK_EXIT} -eq 0 ]; then
            if [ "${EVENT_NAME}" = "push" ]; then
              echo "Release tag '${TAG}' already exists on remote origin. Nothing new to release on this push."
              exit 0
            else
              echo "::error::Git tag '${TAG}' already exists on remote origin. Release workflow requires a new version tag."
              exit 1
            fi
          elif [ ${TAG_CHECK_EXIT} -eq 2 ]; then
            echo "Verified remote tag '${TAG}' does not exist (clean)."
          else
            echo "::error::Failed to check remote tag '${TAG}' (fail-closed, exit ${TAG_CHECK_EXIT}): ${TAG_CHECK_OUTPUT}"
            exit 1
          fi

          # 3. Check for existing GitHub Release collision (no-clobber, fail-closed)
          set +e
          RELEASE_API_OUTPUT=$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>&1)
          API_EXIT=$?
          set -e

          if [ ${API_EXIT} -eq 0 ]; then
            echo "::error::GitHub Release '${TAG}' already exists. Release workflow requires a new version tag."
            exit 1
          elif echo "${RELEASE_API_OUTPUT}" | grep -q -E '\(HTTP 404\)'; then
            echo "Verified release '${TAG}' does not exist (404 Not Found)."
          else
            echo "::error::GitHub release check failed unexpectedly (fail-closed): ${RELEASE_API_OUTPUT}"
            exit 1
          fi

          echo "Validation succeeded for new tag ${TAG} at commit ${COMMIT_SHA}"

      - name: Synchronize version files across Go and Web
        if: steps.resolve_tag.outputs.should_release == 'true'
        env:
          NEW_VERSION: ${{ steps.resolve_tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "==> Synchronizing project versions to ${NEW_VERSION}..."

          # Update Go internal version
          sed -i -E "s/const Version = \"[^\"]+\"/const Version = \"${NEW_VERSION}\"/" plugins/auto-switcher-pro/internal/version/version.go

          # Update Web package.json
          node -e "
            const fs = require('fs');
            const p = './plugins/auto-switcher-pro/web/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = '${NEW_VERSION}';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update Web package-lock.json if present
          node -e "
            const fs = require('fs');
            const p = './plugins/auto-switcher-pro/web/package-lock.json';
            if (fs.existsSync(p)) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = '${NEW_VERSION}';
              if (pkg.packages && pkg.packages['']) {
                pkg.packages[''].version = '${NEW_VERSION}';
              }
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

          # Update Extension package.json if present
          node -e "
            const fs = require('fs');
            const p = './extensions/cpamc-auto-switcher/package.json';
            if (fs.existsSync(p)) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = '${NEW_VERSION}';
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

          echo "Synchronized version to ${NEW_VERSION}:"
          git diff plugins/auto-switcher-pro/internal/version/version.go plugins/auto-switcher-pro/web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/auto-switcher-pro/web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Install web dependencies
        working-directory: plugins/auto-switcher-pro/web
        run: npm ci

      - name: Run web tests
        working-directory: plugins/auto-switcher-pro/web
        run: npm test -- --run

      - name: Build web assets
        if: steps.resolve_tag.outputs.should_release == 'true'
        working-directory: plugins/auto-switcher-pro/web
        run: npm run build

      - name: Run Go tests
        if: steps.resolve_tag.outputs.should_release == 'true'
        working-directory: plugins/auto-switcher-pro
        run: go test -v ./...

      - name: Build Linux amd64 shared library
        if: steps.resolve_tag.outputs.should_release == 'true'
        run: |
          ./scripts/build-plugin.sh amd64
          test -f bin/auto-switcher-pro-linux-amd64.so

      - name: Install arm64 and windows cross-compilation toolchains
        if: steps.resolve_tag.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-mingw-w64-x86-64

      - name: Build Linux arm64 shared library
        if: steps.resolve_tag.outputs.should_release == 'true'
        run: |
          ./scripts/build-plugin.sh arm64
          test -f bin/auto-switcher-pro-linux-arm64.so

      - name: Build Windows amd64 shared library (.dll)
        if: steps.resolve_tag.outputs.should_release == 'true'
        run: |
          ./scripts/build-plugin.sh windows-amd64
          test -f bin/auto-switcher-pro-windows-amd64.dll

      - name: Verify ELF binary architecture and glibc linkage
        if: steps.resolve_tag.outputs.should_release == 'true'
        working-directory: bin
        run: |
          set -euo pipefail

          echo "=== Inspecting Linux amd64 binary ==="
          test -f auto-switcher-pro-linux-amd64.so
          file auto-switcher-pro-linux-amd64.so
          readelf -h auto-switcher-pro-linux-amd64.so
          readelf -h auto-switcher-pro-linux-amd64.so | grep -q "ELF64"
          readelf -h auto-switcher-pro-linux-amd64.so | grep -q -E "Advanced Micro Devices X86-64|x86-64"
          readelf -d auto-switcher-pro-linux-amd64.so | grep -q -E "NEEDED.*libc\.so\.6"

          echo "=== Inspecting Linux arm64 binary ==="
          test -f auto-switcher-pro-linux-arm64.so
          file auto-switcher-pro-linux-arm64.so
          readelf -h auto-switcher-pro-linux-arm64.so
          readelf -h auto-switcher-pro-linux-arm64.so | grep "ELF64"
          readelf -h auto-switcher-pro-linux-arm64.so | grep -q -E "AArch64|aarch64"
          readelf -d auto-switcher-pro-linux-arm64.so | grep -q -E "NEEDED.*libc\.so\.6"

          # Confirm neither binary links against musl
          if readelf -d auto-switcher-pro-linux-amd64.so | grep -iq "musl"; then
            echo "::error::amd64 binary appears to link against musl instead of glibc"
            exit 1
          fi
          if readelf -d auto-switcher-pro-linux-arm64.so | grep -iq "musl"; then
            echo "::error::arm64 binary appears to link against musl instead of glibc"
            exit 1
          fi

          echo "=== Inspecting Windows amd64 PE32+ DLL binary ==="
          test -f auto-switcher-pro-windows-amd64.dll
          file auto-switcher-pro-windows-amd64.dll
          file auto-switcher-pro-windows-amd64.dll | grep -q "PE32+"
          file auto-switcher-pro-windows-amd64.dll | grep -q "x86-64"

          echo "Binary verification succeeded for Linux amd64, Linux arm64, and Windows amd64."

      - name: Upload Linux amd64 binary artifact (.so only)
        if: steps.resolve_tag.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auto-switcher-pro-linux-amd64
          path: bin/auto-switcher-pro-linux-amd64.so
          if-no-files-found: error

      - name: Upload Linux arm64 binary artifact (.so only)
        if: steps.resolve_tag.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auto-switcher-pro-linux-arm64
          path: bin/auto-switcher-pro-linux-arm64.so
          if-no-files-found: error

      - name: Upload Windows amd64 binary artifact (.dll only)
        if: steps.resolve_tag.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auto-switcher-pro-windows-amd64
          path: bin/auto-switcher-pro-windows-amd64.dll
          if-no-files-found: error

  publish:
    name: Publish Release to GitHub
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.repository == 'WiloxDev/cpamc-auto-switcher-pro' || github.repository == 'gonzalez962/cpamc-auto-switcher') && needs.build.outputs.should_release == 'true'
    steps:
      - name: Verify repository authorization
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${REPO}" != "WiloxDev/cpamc-auto-switcher-pro" ] && [ "${REPO}" != "gonzalez962/cpamc-auto-switcher" ]; then
            echo "::error::Unauthorized repository: ${REPO}. Workflow only allowed on authorized repositories."
            exit 1
          fi

      - name: Checkout repository at verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download Linux amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-switcher-pro-linux-amd64
          path: release-assets

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-switcher-pro-linux-arm64
          path: release-assets

      - name: Download Windows amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-switcher-pro-windows-amd64
          path: release-assets

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          test -f auto-switcher-pro-linux-amd64.so
          test -f auto-switcher-pro-linux-arm64.so
          test -f auto-switcher-pro-windows-amd64.dll
          sha256sum auto-switcher-pro-linux-amd64.so > auto-switcher-pro-linux-amd64.so.sha256
          sha256sum auto-switcher-pro-linux-arm64.so > auto-switcher-pro-linux-arm64.so.sha256
          sha256sum auto-switcher-pro-windows-amd64.dll > auto-switcher-pro-windows-amd64.dll.sha256
          echo "SHA256 checksums:"
          cat auto-switcher-pro-linux-amd64.so.sha256
          cat auto-switcher-pro-linux-arm64.so.sha256
          cat auto-switcher-pro-windows-amd64.dll.sha256

      - name: Recheck collisions and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          TARGET_COMMIT: ${{ needs.build.outputs.commit_sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          # 1. Recheck tag collision: ensure remote tag still does not exist (fail-closed)
          set +e
          TAG_CHECK_OUTPUT=$(git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" 2>&1)
          TAG_CHECK_EXIT=$?
          set -e

          if [ ${TAG_CHECK_EXIT} -eq 0 ]; then
            echo "::error::Git tag '${RELEASE_TAG}' already exists on remote origin: ${TAG_CHECK_OUTPUT}"
            exit 1
          elif [ ${TAG_CHECK_EXIT} -eq 2 ]; then
            echo "Verified remote tag '${RELEASE_TAG}' does not exist (clean)."
          else
            echo "::error::Failed to check remote tag '${RELEASE_TAG}' (fail-closed, exit ${TAG_CHECK_EXIT}): ${TAG_CHECK_OUTPUT}"
            exit 1
          fi

          # 2. Recheck release collision: ensure GitHub Release still does not exist (no-clobber, fail-closed)
          set +e
          RELEASE_API_OUTPUT=$(gh api "repos/${REPO}/releases/tags/${RELEASE_TAG}" 2>&1)
          API_EXIT=$?
          set -e

          if [ ${API_EXIT} -eq 0 ]; then
            echo "::error::GitHub Release '${RELEASE_TAG}' already exists."
            exit 1
          elif echo "${RELEASE_API_OUTPUT}" | grep -q -E '\(HTTP 404\)'; then
            echo "Verified release '${RELEASE_TAG}' does not exist (404 Not Found)."
          else
            echo "::error::GitHub release check failed unexpectedly (fail-closed): ${RELEASE_API_OUTPUT}"
            exit 1
          fi

          # 3. Check origin/main still contains target commit
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          MAIN_COMMIT=$(git rev-parse --verify refs/remotes/origin/main)
          if ! git merge-base --is-ancestor "${TARGET_COMMIT}" "${MAIN_COMMIT}"; then
            echo "::error::Target commit ${TARGET_COMMIT} is not an ancestor of origin/main (${MAIN_COMMIT})."
            exit 1
          fi
          echo "Verified target commit ${TARGET_COMMIT} is contained in origin/main (${MAIN_COMMIT})."

          # 4. Generate release notes
          {
            printf '## Auto Switcher Pro Plugin %s\n\n' "${RELEASE_TAG}"
            printf 'Pre-built Linux amd64/arm64 (.so), Windows amd64 (.dll), and macOS Apple Silicon M1-M4 (.dylib) shared libraries for CLIProxyAPI `auto-switcher-pro` plugin.\n\n'
            printf '### Artifacts\n'
            printf -- '- `auto-switcher-pro-linux-amd64.so`: Linux amd64 shared library plugin (`-buildmode=c-shared`)\n'
            printf -- '- `auto-switcher-pro-linux-amd64.so.sha256`: SHA-256 checksum for Linux amd64 binary\n'
            printf -- '- `auto-switcher-pro-linux-arm64.so`: Linux arm64 (glibc / Docker Mac M1-M4) shared library plugin (`-buildmode=c-shared`)\n'
            printf -- '- `auto-switcher-pro-linux-arm64.so.sha256`: SHA-256 checksum for Linux arm64 binary\n'
            printf -- '- `auto-switcher-pro-windows-amd64.dll`: Windows x86_64 PE32+ shared DLL plugin (`-buildmode=c-shared`)\n'
            printf -- '- `auto-switcher-pro-windows-amd64.dll.sha256`: SHA-256 checksum for Windows amd64 binary\n'
            printf -- '- `auto-switcher-pro-darwin-arm64.dylib`: macOS Apple Silicon M1-M4 Mach-O shared library plugin (`-buildmode=c-shared`)\n'
            printf -- '- `auto-switcher-pro-darwin-arm64.dylib.sha256`: SHA-256 checksum for macOS Apple Silicon binary\n\n'
            printf '### Supported Architectures & Environments\n'
            printf -- '- **Linux amd64**: Standard x86_64 Linux distributions with glibc (Debian, Ubuntu, RHEL, CentOS, Fedora)\n'
            printf -- '- **Linux arm64**: ARM64 / AArch64 Linux distributions with glibc (Raspberry Pi OS 64-bit, AWS Graviton, Apple Silicon Docker Linux containers).\n'
            printf -- '- **Windows amd64**: Windows 10/11 / Windows Server x86_64 running native `CLIProxyAPI.exe` or `cli-proxy-api.exe`.\n'
            printf -- '- **macOS Apple Silicon (M1-M4)**: macOS Sonoma / Sequoia on ARM64 running native `CLIProxyAPI`.\n\n'
            printf '### Build Provenance\n'
            printf -- '- **Commit**: `%s`\n' "${TARGET_COMMIT}"
            printf -- '- **Tag**: `%s` (created by release workflow)\n' "${RELEASE_TAG}"
            printf -- '- **Branch**: `main`\n'
            printf -- '- **Go Version**: 1.22\n'
            printf -- '- **Node Version**: 20\n\n'
            printf '### Verification\n'
            printf '```bash\n'
            printf '# For Linux amd64:\n'
            printf 'sha256sum -c auto-switcher-pro-linux-amd64.so.sha256\n\n'
            printf '# For Linux arm64:\n'
            printf 'sha256sum -c auto-switcher-pro-linux-arm64.so.sha256\n\n'
            printf '# For Windows amd64:\n'
            printf 'sha256sum -c auto-switcher-pro-windows-amd64.dll.sha256\n'
            printf '```\n'
          } > release-notes.md

          # 5. Create release and upload binaries + checksums using GitHub CLI
          # Note: --verify-tag is intentionally omitted so gh creates the tag at --target commit
          gh release create "${RELEASE_TAG}" \
            release-assets/auto-switcher-pro-linux-amd64.so \
            release-assets/auto-switcher-pro-linux-amd64.so.sha256 \
            release-assets/auto-switcher-pro-linux-arm64.so \
            release-assets/auto-switcher-pro-linux-arm64.so.sha256 \
            release-assets/auto-switcher-pro-windows-amd64.dll \
            release-assets/auto-switcher-pro-windows-amd64.dll.sha256 \
            --target "${TARGET_COMMIT}" \
            --title "Auto Switcher Pro Plugin ${RELEASE_TAG}" \
            --notes-file release-notes.md
